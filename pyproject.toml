[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithts"
version = "0.1.0"
description = "Atomic numpy-first primitives for constructing time series step by step."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[tool.setuptools]
packages = ["atomic_timeseries", "faithts", "faithts_pipeline"]
